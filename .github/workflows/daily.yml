name: daily

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  push:
    branches: [main]
    paths:
      - "fetch_leaderboard.py"
      - "aes_gcm.py"
      - "pick_free_models.py"
      - "to_csv.py"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-leaderboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fetch_leaderboard.py exits 2 and writes nothing when the dataset is
      # incomplete (<700 models, <30 benchmarks, or missing omniscience /
      # automationbench rows), so a broken scrape never reaches a commit.
      - name: Fetch leaderboard
        run: |
          python3 fetch_leaderboard.py
          python3 -c "
          import json
          d = json.load(open('data/leaderboard.json'))
          assert d['modelCount'] >= 700, f\"only {d['modelCount']} models\"
          assert d['benchmarkCount'] >= 30, f\"only {d['benchmarkCount']} benchmarks\"
          print(f\"ok: {d['modelCount']} models, {d['benchmarkCount']} benchmarks\")
          "

      - name: Pick free models + CSV
        run: |
          python3 pick_free_models.py --max-price 0.001 --top 30
          python3 to_csv.py

      - name: Commit refreshed data
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh leaderboard $(date -u +%F)"
            git push
          fi
